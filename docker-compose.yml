services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wherehouse
      POSTGRES_USER: wherehouse
      POSTGRES_PASSWORD: wherehouse
    volumes:
      - wherehouse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wherehouse -d wherehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: wherehouse-api:local
    build:
      context: ./backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      WHEREHOUSE_ENV: local
      DATABASE_URL: postgresql+asyncpg://wherehouse:wherehouse@postgres:5432/wherehouse
      IMAGE_STORAGE_BACKEND: local
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:8080
      BACKUP_LOCAL_DIR: /data/backups
      BACKUP_STAGING_DIR: /data/backup-staging
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: wherehouse-api:local
    build:
      context: ./backend
    environment:
      WHEREHOUSE_ENV: local
      DATABASE_URL: postgresql+asyncpg://wherehouse:wherehouse@postgres:5432/wherehouse
      IMAGE_STORAGE_BACKEND: local
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:8080
      BACKUP_LOCAL_DIR: /data/backups
      BACKUP_STAGING_DIR: /data/backup-staging
    volumes:
      - wherehouse-uploads:/data/uploads
      - wherehouse-backups:/data/backups
      - wherehouse-backup-staging:/data/backup-staging
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: wherehouse-web:local
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  wherehouse-postgres:
  wherehouse-uploads:
  wherehouse-backups:
  wherehouse-backup-staging:
