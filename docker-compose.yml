services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wherehouse
      POSTGRES_USER: wherehouse
      POSTGRES_PASSWORD: wherehouse
    volumes:
      - wherehouse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wherehouse -d wherehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      WHEREHOUSE_ENV: local
      DATABASE_URL: postgresql+asyncpg://wherehouse:wherehouse@postgres:5432/wherehouse
      UPLOAD_DIR: /data/uploads
    volumes:
      - wherehouse-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  wherehouse-postgres:
  wherehouse-uploads:
