name: Publish appliance application release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed semantic-version tag to publish
        required: true

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04-arm
    environment: appliance-release
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      WHEREHOUSE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}/
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Verify hosted ARM64 release tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          command -v git
          command -v python3
          command -v uv
          command -v node
          command -v corepack
          command -v docker
          command -v openssl
          command -v gh
          uv run --project backend python -c 'import platform; assert platform.machine() == "aarch64"'
          docker info >/dev/null
      - name: Validate immutable tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"
      - name: Run release tests
        run: |
          python3 -m unittest discover -s deploy/raspberry-pi/tests -p 'test_*.py'
          cd backend && uv run python -m pytest && uv run ruff check app tests
          corepack enable && pnpm install --frozen-lockfile
          pnpm --filter @wherehouse/web test && pnpm -r typecheck
      - name: Materialize and verify release keys
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.WHEREHOUSE_RELEASE_SIGNING_KEY_PEM }}
          RELEASE_PUBLIC_KEY_PEM: ${{ secrets.WHEREHOUSE_RELEASE_PUBLIC_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY_PEM" || { echo 'Missing protected WHEREHOUSE_RELEASE_SIGNING_KEY_PEM secret' >&2; exit 1; }
          test -n "$RELEASE_PUBLIC_KEY_PEM" || { echo 'Missing WHEREHOUSE_RELEASE_PUBLIC_KEY_PEM secret' >&2; exit 1; }
          signing_key="$RUNNER_TEMP/wherehouse-release-private.pem"
          public_key="$RUNNER_TEMP/wherehouse-release-public.pem"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" > "$signing_key"
          printf '%s\n' "$RELEASE_PUBLIC_KEY_PEM" > "$public_key"
          private_fingerprint=$(openssl pkey -in "$signing_key" -pubout -outform DER | openssl dgst -sha256 | awk '{print $2}')
          public_fingerprint=$(openssl pkey -pubin -in "$public_key" -outform DER | openssl dgst -sha256 | awk '{print $2}')
          test -n "$private_fingerprint"
          test "$private_fingerprint" = "$public_fingerprint" || { echo 'Release private key does not match appliance verification public key' >&2; exit 1; }
          echo "Verified release key pair: $private_fingerprint"
          echo "WHEREHOUSE_RELEASE_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"
          echo "WHEREHOUSE_RELEASE_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"
      - name: Build and self-verify signed ARM64 release
        run: ./build-release.sh "${RELEASE_TAG#v}"
      - name: Remove materialized release keys
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$WHEREHOUSE_RELEASE_SIGNING_KEY" "$WHEREHOUSE_RELEASE_PUBLIC_KEY"
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -z "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "release.json")' 2>/dev/null || true)" || { echo 'Release artifacts already published; refusing overwrite' >&2; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "WhereHouse $version" --generate-notes
          gh release upload "$RELEASE_TAG" dist/releases/"$version"/*
