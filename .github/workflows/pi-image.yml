name: Raspberry Pi image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version placed in image metadata
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        model: [pi4, pi5]
    steps:
      - uses: actions/checkout@v4
      - name: Build image and release metadata
        run: ./deploy/raspberry-pi/image/build-image.sh '${{ inputs.version }}' '${{ matrix.model }}'
      - uses: actions/upload-artifact@v4
        with:
          name: wherehouse-${{ matrix.model }}-${{ inputs.version }}
          path: dist/pi/*
